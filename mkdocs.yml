site_name: CO2 Grid Meter
site_description: Carbon-intensity tracker for a Pico W + e-ink display.
repo_url: https://github.com/fabiocicerchia/co2-grid-meter
docs_dir: docs

theme:
  name: material
  palette:
    - scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

nav:
  - Home: README.md
  - Architecture: architecture.md
  - Firmware and hardware: firmware.md
  - Getting Started: getting-started.md

markdown_extensions:
  - admonition
  - pymdownx.superfences
