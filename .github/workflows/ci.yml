name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Lint and secret scanning live in code-quality.yml and security.yml.
# This workflow runs the tests — without it nothing here proves they pass.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # A github-actions bump touches workflow files only, never the code under test.
    if: ${{ !startsWith(github.head_ref, 'dependabot/github_actions/') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          # Runtime plus pytest, hash-pinned. Regenerate after editing
          # requirements.txt or requirements-dev.txt:
          #   uv pip compile requirements-dev.txt --generate-hashes \
          #     --universal -p 3.10 -o requirements-dev.lock
          pip install --require-hashes -r requirements-dev.lock

      - name: Test
        run: make test
