name: release

# release-please reads Conventional Commit messages on main and keeps an open
# "release PR" with the next version bump + CHANGELOG. Merging that PR tags the
# release (vX.Y.Z) and publishes a GitHub Release. Nothing else to run.

on:
  push:
    branches: [main]

permissions:
  contents: write # create tags & releases
  pull-requests: write # open/update the release PR

# One-time setup so release-please can OPEN its release PR. The permissions
# block above is necessary but NOT sufficient: opening a PR from a workflow is
# additionally gated by a repo setting. Pick ONE:
#   1. Settings > Actions > General > Workflow permissions >
#      enable "Allow GitHub Actions to create and approve pull requests".
#      The default GITHUB_TOKEN then works and no secret is needed.
#   2. Add a Personal Access Token (contents + pull-requests: write) as the
#      RELEASE_PLEASE_TOKEN secret. The step below picks it up automatically.
# Without one of these the run fails with "GitHub Actions is not permitted to
# create or approve pull requests" at the create-PR step.

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071  # v4
        with:
          # Prefer a PAT if provided (option 2 above); otherwise fall back to
          # the default token (option 1 above).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # "simple" is language-agnostic (tracks version.txt + CHANGELOG).
          release-type: simple
